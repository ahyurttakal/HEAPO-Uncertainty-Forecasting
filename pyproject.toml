[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heapo-forecasting"
version = "1.0.0"
description = "Leakage-resistant uncertainty-aware multi-horizon heat-pump demand forecasting with HEAPO"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Ahmet Yurttakal"}]
keywords = [
  "heat pumps",
  "probabilistic forecasting",
  "conformal prediction",
  "LightGBM",
  "Temporal Fusion Transformer",
  "demand response",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "lightgbm>=4.3,<5",
  "shap>=0.46,<1",
  "PyYAML>=6,<7",
  "pyarrow>=15,<22",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "holidays>=0.56,<1",
  "joblib>=1.3,<2",
  "tqdm>=4.65,<5",
  "requests>=2.31,<3",
]

[project.urls]
Homepage = "https://github.com/ahyurttakal/HEAPO-Uncertainty-Forecasting"
Repository = "https://github.com/ahyurttakal/HEAPO-Uncertainty-Forecasting"
Issues = "https://github.com/ahyurttakal/HEAPO-Uncertainty-Forecasting/issues"

[project.optional-dependencies]
tft = [
  "torch>=2.3,<3",
  "lightning>=2.3,<3",
  "pytorch-forecasting>=1.2,<2",
  "tensorboard>=2.16,<3",
]
manuscript = [
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
]
dev = [
  "build>=1.2,<2",
]

[project.scripts]
heapo-forecast = "heapo_forecasting.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heapo_forecasting = ["configs/*.yaml"]
