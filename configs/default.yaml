# Canonical user-facing defaults. Keep this file synchronized with
# src/heapo_forecasting/configs/default.yaml, which is bundled in wheels.
project:
  run_name: heapo_main
  output_root: outputs
  seed: 2026

data:
  root: /absolute/path/to/heapo_data
  timezone: Europe/Zurich
  target: kWh_received_HeatPump
  timestamp: Timestamp
  household_id: Household_ID
  hp_type_column: Survey_HeatPump_Installation_Type
  allowed_hp_types:
    air-source: ASHP
    ground-source: GSHP
  weather_scenario: operational  # operational | oracle
  short_gap_steps: 1

inclusion:
  min_days: 180
  max_target_missing_fraction: 0.10
  min_heating_seasons: 1
  heating_months: [10, 11, 12, 1, 2, 3, 4]
  min_weather_match_fraction: 0.90

features:
  lag_steps: [1, 4, 24, 96, 672]
  rolling_steps: [4, 12, 24, 48, 96]
  history_steps: 672
  forecast_steps: 96
  on_threshold_kwh: 0.05
  heating_base_temperature_c: 18.0

split:
  unseen_household_fraction: 0.20
  validation_household_fraction: 0.10
  temporal_train_fraction: 0.70
  temporal_calibration_fraction: 0.15
  rolling_folds: 3

sampling:
  train_origin_stride: 4
  eval_origin_stride: 96
  max_train_rows: 500000
  max_eval_origins_per_household: 120
  horizon_batch_size: 16

models:
  quantiles: [0.10, 0.50, 0.90]
  elastic_net:
    alpha: 0.001
    l1_ratio: 0.20
  lightgbm:
    n_estimators: 800
    learning_rate: 0.04
    num_leaves: 63
    max_depth: -1
    min_child_samples: 100
    subsample: 0.80
    colsample_bytree: 0.80
    reg_alpha: 0.05
    reg_lambda: 0.20
    n_jobs: -1
  conformal:
    alpha: 0.20
    min_samples_per_horizon: 100
    min_samples_per_condition: 100
  tft:
    enabled: true
    max_encoder_length: 672
    max_prediction_length: 96
    max_train_rows_per_household: 5000
    max_eval_rows_per_household: 768
    max_eval_origins_per_household: 12
    reference_model: lightgbm
    reuse_existing_checkpoint: true
    resume_training_from_checkpoint: false
    learning_rate: 0.03
    hidden_size: 32
    attention_head_size: 4
    hidden_continuous_size: 16
    dropout: 0.15
    batch_size: 64
    max_epochs: 30
    patience: 5

evaluation:
  report_horizons: [1, 4, 24, 96]
  cold_temperature_quantile: 0.05
  peak_threshold_quantile: 0.95
  top_peak_fraction: 0.05
  mase_season_steps: 96
  mase_min_differences: 96

statistics:
  bootstrap_repetitions: 1000
  confidence: 0.95
  multiple_testing_alpha: 0.05
  minimum_households_for_confirmatory: 20
  portfolio_sensitivity_thresholds: [20, 30, 50]
  comparisons:
    - [lightgbm, persistence]
    - [lightgbm, seasonal_daily]
    - [lightgbm, seasonal_weekly]
    - [lightgbm, elastic_net]

portfolio:
  # Sizes are intentionally bounded by the held-out GSHP cohort. Infeasible
  # combinations are skipped and never extrapolated.
  sizes: [4, 5, 10, 25]
  types: [ASHP, GSHP, mixed]
  repetitions: 20
  min_household_coverage: 0.90
  min_calibration_samples: 100
  destination_capacity_factor: 1.0
  flexible_fractions: [0.05, 0.10, 0.15, 0.20]
  shift_hours: [1, 2, 3]

scenarios:
  weather: [operational, oracle]
  run_tft_for_oracle: false
